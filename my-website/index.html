<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A new website, ready for your content.">
    <title>My Website</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="./">My Website</a>
      <nav aria-label="Main navigation">
        <a href="#about">About</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="welcome-heading">
        <p class="eyebrow">A fresh start</p>
        <h1 id="welcome-heading">Welcome to your new website</h1>
        <p>Replace this text with whatever you want to share with the world.</p>
        <a class="button" href="#about">Learn more</a>
      </section>

      <section class="about" id="about" aria-labelledby="about-heading">
        <h2 id="about-heading">About this site</h2>
        <p>Your content goes here. Edit this section to make the site your own.</p>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> My Website</p>
    </footer>
  </body>
</html>
